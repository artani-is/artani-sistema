name: artani

services:
  db:
    image: postgres:18
    container_name: artani_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artani
      POSTGRES_PASSWORD: artani_dev
      POSTGRES_DB: artani
      TZ: America/Mexico_City
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - artani_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artani -d artani"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  artani_pgdata:
